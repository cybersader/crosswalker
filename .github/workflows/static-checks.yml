name: Static Checks

# These gates are cheap, repo-wide, and independent of the plugin build, so they
# run on every push and PR without path filters. `check:personal-data` in
# particular must see the whole tree: a leaked absolute path or email can land in
# any file, not just the ones a given change happens to touch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Only check:frontmatter needs dependencies: it deliberately loads the same
      # js-yaml that Astro uses, so it catches the strict-YAML errors check:mdx
      # misses. The other checks are dependency-free.
      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Personal data (paths, emails, denylist)
        run: bun run check:personal-data

      - name: MDX syntax
        run: bun run check:mdx

      - name: Frontmatter
        run: bun run check:frontmatter

      - name: not-content guard
        run: bun run check:not-content

      - name: Log labels
        run: bun run check:log-labels

      # Resolves every internal doc link against the filesystem. Astro builds
      # and deploys pages full of broken internal links without complaint, so
      # this is the only thing standing between an archived/renamed page and a
      # silent 404 for anyone who follows a link to it.
      - name: Internal doc links
        run: bun run check:links

      # Knowledge-ops gates (2026-10-03). See root CLAUDE.md § Documentation
      # update reminders, "Gates". `bun run check` runs every check:* locally.
      - name: Living-page freshness
        run: bun run check:freshness

      - name: Unverified claims are tracked
        run: bun run check:unverified-claims

      - name: Roadmap sources agree
        run: bun run check:roadmap-sync

      - name: Repo paths named in docs exist
        run: bun run check:repo-paths
