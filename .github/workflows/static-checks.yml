name: Static Checks

# These gates are cheap, repo-wide, and independent of the plugin build, so they
# run on every push and PR without path filters. `check:personal-data` in
# particular must see the whole tree: a leaked absolute path or email can land in
# any file, not just the ones a given change happens to touch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Parity parses source with the existing TypeScript dependency, without
      # loading the plugin. MDX and strict frontmatter checks use docs dependencies.
      - name: Install root dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Personal data (paths, emails, denylist)
        run: bun run check:personal-data

      - name: MDX syntax
        run: bun run check:mdx

      - name: Frontmatter
        run: bun run check:frontmatter

      - name: not-content guard
        run: bun run check:not-content

      - name: Log labels
        run: bun run check:log-labels

      # Resolves every internal doc link against the filesystem. Astro builds
      # and deploys pages full of broken internal links without complaint, so
      # this is the only thing standing between an archived/renamed page and a
      # silent 404 for anyone who follows a link to it.
      - name: Internal doc links
        run: bun run check:links

      - name: UI and CLI capability parity
        run: bun run check:parity
