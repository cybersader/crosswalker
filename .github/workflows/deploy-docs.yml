# Docs pipeline: the deploy is gated on the Playwright suite passing against
# the exact dist that will be deployed.
#
# Until 2026-08-24 this workflow built and deployed WITHOUT running any test.
# The docs Playwright suite (36 tests) existed for months and was never invoked
# by CI; the Ch 44 review caught it (the challenge brief itself wrongly claimed
# it was enforced). Test-then-deploy on the same artifact is the fix: the tested
# bytes are the shipped bytes.
name: Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Per-ref grouping so a PR run can never cancel an in-flight main deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every PR and main push, then skips the docs build visibly (job shown
  # as skipped, with a notice) when nothing under docs/ changed.
  changes:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LIGHT || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: >-
          bash .github/scripts/changed-paths.sh
          '^(docs/|\.github/workflows/deploy-docs\.yml$|\.github/scripts/changed-paths\.sh$)'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04).
    # Return to ubuntu-latest once Playwright supports that image.
    runs-on: ${{ fromJSON(vars.RUNS_ON_LIGHT || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: docs
        run: bun x playwright install --with-deps chromium

      - name: Build docs
        working-directory: docs
        run: bun run build

      # playwright.config.ts auto-starts `astro preview --port 14325`, which
      # serves the dist/ built above — the suite tests the deployable artifact.
      - name: Run Playwright suite
        working-directory: docs
        run: bun run test:local

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: docs/playwright-report
          retention-days: 7

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNS_ON_LIGHT || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
