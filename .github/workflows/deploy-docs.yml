# Docs pipeline: the deploy is gated on the Playwright suite passing against
# the exact dist that will be deployed.
#
# Until 2026-08-24 this workflow built and deployed WITHOUT running any test.
# The docs Playwright suite (36 tests) existed for months and was never invoked
# by CI; the Ch 44 review caught it (the challenge brief itself wrongly claimed
# it was enforced). Test-then-deploy on the same artifact is the fix: the tested
# bytes are the shipped bytes.
name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref grouping so a PR run can never cancel an in-flight main deploy.
concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04).
    # Return to ubuntu-latest once Playwright supports that image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs
        run: bun install

      - name: Install Playwright Chromium
        working-directory: docs
        run: bun x playwright install --with-deps chromium

      - name: Build docs
        working-directory: docs
        run: bun run build

      # playwright.config.ts auto-starts `astro preview --port 14325`, which
      # serves the dist/ built above — the suite tests the deployable artifact.
      - name: Run Playwright suite
        working-directory: docs
        run: bun run test:local

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: docs/playwright-report
          retention-days: 7

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
