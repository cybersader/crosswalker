name: Quality gate

# Gate v1: the same `bun run check` a contributor runs locally (lint, typecheck,
# unit tests, version consistency and the production build), on every PR and
# every push to main, with no path filters.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version bun.lock was resolved with locally. Bump it deliberately,
          # together with the lockfile.
          bun-version-file: .bun-version

      # `bun run test` runs jest through a `#!/usr/bin/env node` shim, so tests
      # execute under Node. The Tier 2 closure tests import `node:sqlite`, which
      # needs Node >= 22.5 and does not exist under Bun.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Lint, typecheck, test, check versions and build
        run: bun run check
