version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Both roots are Bun-managed (bun.lock). Dependabot's npm updater refuses
  # to touch bun.lock, so these must use the bun ecosystem.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /docs
    schedule:
      interval: weekly
